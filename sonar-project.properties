sonar.projectKey=NataliaZepeda_RetailQA
sonar.organization=nataliazepeda

# Nombre y ruta del proyecto
sonar.projectName=RetailQA
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# Carpetas a excluir del análisis (dependencias, no código propio)
sonar.exclusions=node_modules/**,**/node_modules/**,coverage/**,tests/**

# Reportes generados por Jest (npm test) para que SonarCloud muestre
# cobertura de código y resultados de tests unitarios
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/sonar-report.xml
