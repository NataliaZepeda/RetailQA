<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RetailQA - Crear cuenta</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="marca" href="/index.html">RetailQA</a>
    <nav class="menu" id="nav-sesion"></nav>
  </header>

  <main>
    <h1>Crear cuenta</h1>
    <div id="mensaje" class="mensaje oculto"></div>
    <form class="formulario" id="form-registro">
      <label>Nombre completo
        <input type="text" id="nombre" required>
      </label>
      <label>Correo
        <input type="email" id="correo" required>
      </label>
      <label>Contraseña (mínimo 6 caracteres)
        <input type="password" id="password" minlength="6" required>
      </label>
      <button type="submit">Crear cuenta</button>
      <p>¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
    </form>
  </main>

  <footer class="footer">
    <p>© 2026 RetailQA — Sitio de práctica para CIN 421 / INF423</p>
  </footer>

  <script src="/js/api.js"></script>
  <script>
    const mensajeDiv = document.getElementById('mensaje');
    document.getElementById('form-registro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value;
      const correo = document.getElementById('correo').value;
      const password = document.getElementById('password').value;
      try {
        await api('POST', '/auth/registro', { nombre, correo, password });
        window.location.href = '/index.html';
      } catch (err) {
        mensajeDiv.textContent = err.message;
        mensajeDiv.className = 'mensaje error';
      }
    });
  </script>
</body>
</html>
